name: Integration

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  #v6.0.3

      - name: .NET setup
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  #v5.3.0
        with:
          dotnet-version: '10.x'

      - name: Restore packages
        run: dotnet restore TaskManager.API/TaskManager.API.sln

      - name: Build API project
        run: dotnet build TaskManager.API/TaskManager.API.csproj --no-restore --configuration Release

      - name: Build unit test project
        run: dotnet build TaskManager.API.Testing.Unit/TaskManager.API.Testing.Unit.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test TaskManager.API.Testing.Unit/TaskManager.API.Testing.Unit.csproj --no-build --configuration Release --verbosity normal
