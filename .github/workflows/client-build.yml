name: Vue Build and Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & E2E Tests
    runs-on: ubuntu-latest

    env:
      CI: true
      # Port the API will listen on. Must match the baseURL in playwright.config.ts.
      API_PORT: 4173
      # ── Adjust these two paths to match your repo layout ──────────────────
      # Directory that contains the Vue project (already used by the defaults below).
      VUE_DIR: TaskManager.Vue
      # Directory that contains the .NET API .csproj (e.g. TaskManager.Api).
      API_DIR: TaskManager.Api
      # ──────────────────────────────────────────────────────────────────────

    defaults:
      run:
        working-directory: ${{ env.VUE_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      # ── .NET API ────────────────────────────────────────────────────────────

      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  #v5.3.0
        with:
          dotnet-version: '10.x'

      - name: Restore API dependencies
        run: dotnet restore
        working-directory: ${{ github.workspace }}/${{ env.API_DIR }}

      - name: Build API
        run: dotnet build --no-restore --configuration Release
        working-directory: ${{ github.workspace }}/${{ env.API_DIR }}

      - name: Start API in background
        run: |
          dotnet run --no-build --configuration Release &
          echo "API_PID=$!" >> "$GITHUB_ENV"
        working-directory: ${{ github.workspace }}/${{ env.API_DIR }}
        env:
          ASPNETCORE_URLS: http://localhost:${{ env.API_PORT }}
          # Use the in-memory provider so no database setup is needed.
          ASPNETCORE_ENVIRONMENT: Test

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API on port $API_PORT…"
          for i in $(seq 1 30); do
            if curl --silent --fail "http://localhost:$API_PORT/health" > /dev/null 2>&1; then
              echo "API is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready in 30 seconds" >&2
          exit 1

      # ── Vue client ──────────────────────────────────────────────────────────

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.VUE_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:${{ env.API_PORT }}

      # ── Cleanup & artifacts ─────────────────────────────────────────────────

      - name: Stop API
        if: always()
        run: |
          if [ -n "$API_PID" ]; then
            kill "$API_PID" || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: ${{ env.VUE_DIR }}/playwright-report/
          retention-days: 3